<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Staff & Permissions - Creperie Kinder</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin-dashboard.css" />
  <style>
    body {
      background: #f5f5f5;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .staff-page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .staff-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .staff-header h1 {
      margin: 0;
      color: #2d3748;
      font-size: 28px;
    }

    .staff-header-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-back {
      padding: 10px 20px;
      background: #ccc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      background: #999;
    }

    .btn-add-staff {
      padding: 10px 20px;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-add-staff:hover {
      background: #E55A2B;
    }

    .staff-table-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .staff-table {
      width: 100%;
      border-collapse: collapse;
    }

    .staff-table thead {
      background: #f7fafc;
    }

    .staff-table th {
      padding: 16px;
      text-align: left;
      font-weight: 600;
      color: #2d3748;
      border-bottom: 2px solid #e2e8f0;
    }

    .staff-table td {
      padding: 16px;
      border-bottom: 1px solid #e2e8f0;
      color: #2d3748;
    }

    .staff-table tbody tr:hover {
      background: #f9fafb;
    }

    .staff-role-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: white;
      display: inline-block;
    }

    .badge-staff-a {
      background: #4299E1;
    }

    .badge-staff-b {
      background: #48BB78;
    }

    .badge-admin {
      background: #E30613;
    }

    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.3s ease;
    }

    .action-delete {
      background: #e53e3e;
      color: white;
    }

    .action-delete:hover {
      background: #c53030;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      color: #2d3748;
      font-size: 20px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }

    .modal-close:hover {
      color: #2d3748;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #2d3748;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #FF6B35;
      box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 24px;
      border-top: 1px solid #e2e8f0;
    }

    .btn-cancel {
      padding: 10px 20px;
      background: #ccc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-submit {
      padding: 10px 24px;
      background: #FF6B35;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-submit:hover {
      background: #E55A2B;
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="staff-page-container">
    <!-- Header -->
    <div class="staff-header">
      <h1>👨‍💼 Staff & Permissions</h1>
      <div class="staff-header-buttons">
        <button id="backBtn" class="btn-back">← Back</button>
        <button id="addStaffBtn" class="btn-add-staff">➕ Add Staff Member</button>
      </div>
    </div>

    <!-- Staff Table -->
    <div class="staff-table-container">
      <table class="staff-table" id="staffTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Permissions</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="staffTableBody">
          <tr>
            <td colspan="5" class="loading">Loading staff members...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add Staff Modal -->
  <div id="staffModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">➕ Add Staff Member</h2>
        <button id="modalCloseBtn" class="modal-close">✕</button>
      </div>
      <form id="staffForm" style="padding: 24px;">
        <div class="form-group">
          <label>Staff Email</label>
          <input type="email" id="staffEmail" placeholder="staff@example.com" required />
        </div>
        <div class="form-group">
          <label>Staff Name</label>
          <input type="text" id="staffName" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="staffRole" required>
            <option value="">-- Select Role --</option>
            <option value="Staff A">Staff A (Read Messages & Reviews)</option>
            <option value="Staff B">Staff B (Manage Orders by Status)</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" id="cancelBtn" class="btn-cancel">Cancel</button>
          <button type="submit" id="submitBtn" class="btn-submit">Add Staff Member</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { getAuthInstance } from './firebase-config.js';
    import DBService from './db-service.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    let dbService;

    // Initialize on page load
    async function init() {
      try {
        console.log('🔄 Staff management page initializing...');
        const auth = await getAuthInstance();
        
        // Wait for authentication state to be established
        onAuthStateChanged(auth, async (user) => {
          if (!user) {
            console.warn('⚠️ No user logged in, redirecting to login...');
            window.location.href = 'login.html';
            return;
          }

          console.log('✅ User logged in as:', user.email);
          dbService = new DBService();
          await loadStaff();
          setupEventListeners();
        });
      } catch (error) {
        console.error('❌ Init error:', error);
      }
    }

    // Setup event listeners
    function setupEventListeners() {
      document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'admin.html';
      });

      document.getElementById('addStaffBtn').addEventListener('click', () => {
        openAddStaffModal();
      });

      document.getElementById('modalCloseBtn').addEventListener('click', () => {
        closeAddStaffModal();
      });

      document.getElementById('cancelBtn').addEventListener('click', () => {
        closeAddStaffModal();
      });

      document.getElementById('staffForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        await saveStaffMember();
      });
    }

    // Load and display staff
    async function loadStaff() {
      try {
        console.log('📚 Loading staff from Firestore...');
        const staff = await dbService.getAllStaff();
        console.log('📊 Staff data received:', staff);
        renderStaffTable(staff);
      } catch (error) {
        console.error('❌ Error loading staff:', error);
        alert('Error loading staff: ' + error.message);
      }
    }

    // Render staff table
    function renderStaffTable(staff) {
      const tbody = document.getElementById('staffTableBody');
      
      const adminRow = `
        <tr style="background:#f0f7ff;">
          <td><strong>Admin (Owner)</strong></td>
          <td>oussamaanis2005@gmail.com</td>
          <td><span class="staff-role-badge badge-admin">Owner</span></td>
          <td>Full Access</td>
          <td><span style="color:#999;font-size:12px;">Default</span></td>
        </tr>
      `;

      if (staff.length === 0) {
        tbody.innerHTML = adminRow + `
          <tr>
            <td colspan="5" style="text-align:center;padding:20px;color:#999;">
              No staff members added yet
            </td>
          </tr>
        `;
        return;
      }

      const staffRows = staff.map(member => `
        <tr>
          <td><strong>${member.name}</strong></td>
          <td>${member.email}</td>
          <td>
            <span class="staff-role-badge ${member.role === 'Staff A' ? 'badge-staff-a' : 'badge-staff-b'}">
              ${member.role || 'Staff'}
            </span>
          </td>
          <td>
            ${member.role === 'Staff A' ? 'Read Messages & Reviews' : member.role === 'Staff B' ? 'Manage Orders' : 'None'}
          </td>
          <td>
            <button class="action-btn action-delete" data-id="${member.id}">
              🗑️ Remove
            </button>
          </td>
        </tr>
      `).join('');

      tbody.innerHTML = adminRow + staffRows;

      // Add delete event listeners
      document.querySelectorAll('.action-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const staffId = e.target.closest('button').dataset.id;
          await deleteStaffMember(staffId);
        });
      });
    }

    // Open add staff modal
    function openAddStaffModal() {
      document.getElementById('staffEmail').value = '';
      document.getElementById('staffName').value = '';
      document.getElementById('staffRole').value = '';
      document.getElementById('modalTitle').textContent = '➕ Add Staff Member';
      document.getElementById('staffModal').classList.add('active');
    }

    // Close add staff modal
    function closeAddStaffModal() {
      document.getElementById('staffModal').classList.remove('active');
    }

    // Save staff member
    async function saveStaffMember() {
      const email = document.getElementById('staffEmail').value.trim().toLowerCase();
      const name = document.getElementById('staffName').value.trim();
      const role = document.getElementById('staffRole').value;

      if (!email || !name || !role) {
        alert('❌ Please fill all fields');
        return;
      }

      try {
        console.log('👨‍💼 Step 1: Starting staff addition process...');
        console.log('   Email:', email);
        console.log('   Name:', name);
        console.log('   Role:', role);
        
        // Generate consistent ID from email
        const staffId = email.replace(/[^a-z0-9]/g, '_').substring(0, 64);
        console.log('   Generated Staff ID:', staffId);
        
        const staffData = {
          email: email.toLowerCase(),
          name,
          role,
          createdAt: new Date().toISOString()
        };

        // Disable submit button while processing
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').textContent = 'Adding...';

        console.log('👨‍💼 Step 2: Writing to Firestore...');
        await dbService.addStaffWithId(staffId, staffData);
        console.log('✅ Step 2 Complete: Staff written to Firestore');

        console.log('👨‍💼 Step 3: Closing modal...');
        closeAddStaffModal();
        console.log('✅ Step 3 Complete: Modal closed');

        console.log('👨‍💼 Step 4: Reloading staff from Firestore...');
        await loadStaff();
        console.log('✅ Step 4 Complete: Staff reloaded');

        // Reset button
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = 'Add Staff Member';

        alert('✅ Staff member "' + name + '" added successfully as ' + role + '!');
      } catch (error) {
        console.error('❌ Failed to add staff:', error);
        
        // Reset button
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = 'Add Staff Member';
        
        alert('❌ Failed to add staff: ' + error.message);
      }
    }

    // Delete staff member
    async function deleteStaffMember(staffId) {
      if (!confirm('Are you sure you want to remove this staff member?')) return;

      try {
        await dbService.deleteStaff(staffId);
        await loadStaff();
        alert('✅ Staff member removed successfully!');
      } catch (error) {
        console.error('❌ Failed to remove staff:', error);
        alert('❌ Failed to remove staff: ' + error.message);
      }
    }

    // Initialize
    init();
  </script>

</body>
</html>
