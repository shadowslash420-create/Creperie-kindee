<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>تسجيل الدخول - Creperie Kinder</title>
  <link rel="stylesheet" href="style.css" />
  <!-- FirebaseUI CSS -->
  <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.0/firebase-ui-auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #E30613 0%, #C10510 100%);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(255,107,107,0.2) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255,77,77,0.2) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 3px rgba(227,6,19,0.2);
      padding: 50px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 0.6s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-logo {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 800;
      color: #E30613;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(227,6,19,0.2);
    }

    .login-subtitle {
      color: #E30613;
      font-size: 16px;
      margin-bottom: 40px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
    }

    .login-title {
      font-size: 28px;
      color: #2C1810;
      font-family: 'Playfair Display', serif;
      margin-bottom: 15px;
    }

    .login-description {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    #firebaseui-container {
      margin: 20px 0;
    }

    /* FirebaseUI styling overrides */
    .firebaseui-container {
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    .firebaseui-card-content {
      padding: 0;
    }

    .mdl-button--raised.mdl-button--colored {
      background-color: #E30613 !important;
      color: white !important;
    }

    .mdl-button--raised.mdl-button--colored:hover {
      background-color: #C10510 !important;
    }

    .firebaseui-button {
      width: 100%;
    }

    .firebaseui-id-password-button {
      background-color: #E30613 !important;
    }

    .benefits {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #eee;
    }

    .benefit-item {
      display: flex;
      gap: 10px;
      align-items: center;
      text-align: right;
      color: #666;
      font-size: 13px;
    }

    .benefit-icon {
      color: #E30613;
      font-weight: bold;
      flex-shrink: 0;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #E30613;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: #C10510;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .login-card {
        padding: 30px 20px;
      }

      .login-logo {
        font-size: 26px;
      }

      .login-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body dir="rtl">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">CREPERIE KINDER</div>
      <div class="login-subtitle">Imagine it, We make it</div>
      
      <h1 class="login-title">مرحباً بك</h1>
      <p class="login-description">سجل الدخول للاستمتاع بتجربة مخصصة وتتبع طلباتك</p>

      <!-- FirebaseUI Container -->
      <div id="firebaseui-container"></div>

      <div class="benefits">
        <div class="benefit-item">
          <span class="benefit-icon">✓</span>
          <span>احفظ عناوينك المفضلة للتوصيل السريع</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-icon">✓</span>
          <span>تتبع طلباتك في الوقت الفعلي</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-icon">✓</span>
          <span>احصل على عروض وخصومات حصرية</span>
        </div>
        <div class="benefit-item">
          <span class="benefit-icon">✓</span>
          <span>سجل طلباتك السابقة لإعادة الطلب بسهولة</span>
        </div>
      </div>

      <a href="index.html" class="back-link">← العودة إلى الصفحة الرئيسية</a>
    </div>
  </div>

  <!-- Firebase Core Library -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
  
  <!-- FirebaseUI Library -->
  <script src="https://www.gstatic.com/firebasejs/ui/6.0.0/firebase-ui-auth.js"></script>

  <script type="module">
    import { getAuthInstance } from './firebase-config.js';

    // Check user role and get redirect URL
    window.getUserRedirectUrl = async function(email) {
      try {
        const ADMIN_EMAILS = ['oussamaanis2005@gmail.com'];
        if (ADMIN_EMAILS.includes(email)) {
          console.log('👑 Admin user detected:', email);
          return 'admin.html';
        }
        
        // Check Firebase for staff role
        const dbSvc = (await import('./db-service.js')).default;
        await dbSvc.init();
        const allStaff = await dbSvc.getAllStaff();
        console.log('📊 Staff list for role check:', allStaff);
        const staffMember = allStaff.find(s => s.email?.toLowerCase() === email?.toLowerCase());
        
        if (staffMember) {
          console.log('✅ Staff member found:', staffMember);
          if (staffMember.role === 'Staff A') {
            return 'staff-a.html';
          } else if (staffMember.role === 'Staff B') {
            return 'staff-b.html';
          }
        }
        console.log('ℹ️ User is a customer, redirecting to home');
        return 'index.html';
      } catch (error) {
        console.error('❌ Error checking user role:', error);
        return 'index.html';
      }
    };

    // Initialize FirebaseUI
    async function initializeFirebaseUI() {
      const auth = await getAuthInstance();
      
      // FirebaseUI configuration
      const uiConfig = {
        callbacks: {
          signInSuccessWithAuthResult: async function(authResult, redirectUrl) {
            // User successfully signed in
            const user = authResult.user;
            console.log('✅ User authenticated:', user.email);
            
            // Get redirect URL based on role
            const redirectUrl2 = await window.getUserRedirectUrl(user.email);
            window.location.href = redirectUrl2;
            
            // Return false to prevent automatic redirect
            return false;
          },
          uiShown: function() {
            // The UI is now displayed
            console.log('🔐 Firebase Authentication UI loaded');
          }
        },
        signInFlow: 'redirect', // Use redirect instead of popup (works on mobile/webview)
        signInOptions: [
          {
            provider: firebase.auth.GoogleAuthProvider.PROVIDER_ID,
            customParameters: {
              prompt: 'select_account' // Force account selection
            }
          },
          firebase.auth.EmailAuthProvider.PROVIDER_ID,
          {
            provider: firebase.auth.PhoneAuthProvider.PROVIDER_ID,
            recaptchaParameters: {
              type: 'image', // image or audio
              size: 'normal', // 'normal' or 'compact'
              badge: 'bottomleft' //'bottomright' 'inline' 'bottomleft'
            },
            defaultCountry: 'SA'
          }
        ],
        tosUrl: 'index.html',
        privacyPolicyUrl: 'index.html',
        credentialHelper: firebaseui.auth.CredentialHelper.GOOGLE_YOLO
      };

      // Initialize the FirebaseUI Widget using Firebase SDK
      if (!firebaseui.auth.AuthUI.getInstance()) {
        new firebaseui.auth.AuthUI(auth).start('#firebaseui-container', uiConfig);
        console.log('🎯 FirebaseUI initialized successfully');
      }
    }

    // Start initialization when Firebase is ready
    initializeFirebaseUI().catch(err => {
      console.error('❌ FirebaseUI initialization failed:', err);
    });
  </script>
</body>
</html>
