<!doctype html>
<html lang="ar">
<head>

  <title>القائمة - Creperie Kinder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body dir="ltr">
  <!-- Header -->
  <header class="header">
    <div style="display:flex;gap:8px;align-items:center">
      <div class="menu-icon" onclick="toggleMenu()">☰</div>
      <div class="cart-icon" onclick="toggleCart()">🛒</div>
    </div>
    <div class="brand">
      <img src="https://i.ibb.co/LhB29QL5/cropped-Screenshot-20251102-160022-Instagram.jpg" alt="Creperie Kinder Logo" class="brand-logo">
      <div class="brand-text">
        <div class="site-title">CREPERIE KINDER</div>
        <div class="page-indicator" id="page-indicator">Menu</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="lang-btn" id="auth-btn" title="تسجيل الدخول">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
      </button>
      <button class="lang-btn" onclick="toggleLanguage()" id="lang-btn">EN</button>
    </div>
  </header>

  <!-- Tab Carousel Navigation -->
  <div class="tab-carousel-container">
    <button class="tab-carousel-btn tab-carousel-prev" id="tab-prev" onclick="scrollTabCarousel('left')">‹</button>
    <div class="tab-carousel-wrapper">
      <div class="tab-nav" id="tab-nav">
        <!-- Category tabs will be dynamically generated from Firebase -->
      </div>
    </div>
    <button class="tab-carousel-btn tab-carousel-next" id="tab-next" onclick="scrollTabCarousel('right')">›</button>
  </div>

  <!-- Main Content -->
  <div class="container">
    <div id="menu-container">
      <!-- Menu sections will be dynamically generated from Firebase -->
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-links" id="footer-links">
        <a href="index.html" class="nav-link-home">Home</a>
        <a href="about.html" class="nav-link-about">من نحن</a>
        <a href="menu.html" class="nav-link-menu">القائمة</a>
        <a href="my-orders.html" class="nav-link-orders">طلباتي</a>
        <a href="faq.html" class="nav-link-faq">الأسئلة الشائعة</a>
        <a href="feedback.html" class="nav-link-feedback">التقييمات</a>
        <a href="contact.html" class="nav-link-contact">تواصل معنا</a>
      </div>
      <div class="footer-connect">Connect</div>
      <div class="social-icons">
        <a href="https://www.instagram.com/creperie_kinder_5?igsh=NzhpYWNzYTBtMHc4" target="_blank" class="social-icon" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
        <a href="https://tiktok.com/@creperiekinder" target="_blank" class="social-icon" aria-label="TikTok">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg>
        </a>
      </div>
      <div id="footer-copyright" style="margin-top:30px;font-size:13px;color:#fff">
        © Creperie Kinder — طعم ممتع لعائلتك<br>
        اتصل: +213 5X XXX XXXX
      </div>
    </footer>
  </div>

  <!-- Cart Sidebar -->
  <div class="cart-side" id="cart-side">
    <div class="cart-header">
      <h3 id="cart-title">السلة</h3>
      <button class="cart-close" onclick="toggleCart()">×</button>
    </div>
    <div id="cart-contents"></div>
    <div class="cart-total-section">
      <div class="cart-total">
        <span id="total-label">المجموع:</span>
        <strong id="cart-total">0.00 DZD</strong>
      </div>
      <button class="cta" style="width:100%;margin-top:16px" onclick="checkoutFlow()" id="checkout-btn">إتمام الطلب</button>
    </div>
  </div>

  <!-- Navigation Menu Sidebar -->
  <div class="nav-menu" id="nav-menu">
    <div class="nav-menu-header">
      <button class="nav-menu-close" onclick="toggleMenu()">×</button>
    </div>
    <nav class="nav-menu-links">
      <a href="index.html" class="nav-link-home" onclick="toggleMenu()">Home</a>
      <a href="about.html" class="nav-link-about" onclick="toggleMenu()">من نحن</a>
      <a href="menu.html" class="nav-link-menu" onclick="toggleMenu()">القائمة</a>
      <a href="my-orders.html" class="nav-link-orders" onclick="toggleMenu()">طلباتي</a>

    </nav>
    <div class="nav-menu-footer">
      <div class="footer-connect">Connect</div>
      <div class="social-icons">
        <a href="https://www.instagram.com/creperie_kinder_5?igsh=NzhpYWNzYTBtMHc4" target="_blank" class="social-icon" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
        <a href="https://tiktok.com/@creperiekinder" target="_blank" class="social-icon" aria-label="TikTok">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Menu Overlay -->
  <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>

  <script type="module" src="script.js"></script>
  <script type="module" src="auth.js"></script>

</html>
