<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Notifications</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h1 { color: #c41e3a; font-size: 24px; }
    h2 { color: #333; font-size: 18px; margin-top: 0; }
    .status { 
      padding: 10px; 
      border-radius: 5px; 
      margin: 10px 0;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #e7f1ff; color: #004085; }
    button {
      background: #c41e3a;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover { background: #a01830; }
    #log {
      background: #1a1a1a;
      color: #0f0;
      padding: 15px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 11px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>🔔 اختبار الإشعارات</h1>
  
  <div class="card">
    <h2>حالة البيئة</h2>
    <div id="environment"></div>
  </div>

  <div class="card">
    <h2>اختبار OneSignal</h2>
    <button onclick="testOneSignal()">تفعيل الإشعارات</button>
    <div id="onesignal-result"></div>
  </div>

  <div class="card">
    <h2>سجل التشخيص</h2>
    <div id="log"></div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const envEl = document.getElementById('environment');
    
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${msg}\n` + logEl.textContent;
      console.log(msg);
    }

    function showStatus(el, text, type) {
      el.innerHTML += `<div class="status ${type}">${text}</div>`;
    }

    // Check environment on load
    function checkEnvironment() {
      log('Checking environment...');
      
      // User Agent
      showStatus(envEl, `User Agent: ${navigator.userAgent.substring(0, 100)}...`, 'info');
      
      // Check for Median objects
      const checks = {
        'window.median': typeof window.median !== 'undefined',
        'window.gonative': typeof window.gonative !== 'undefined',
        'window.Median': typeof window.Median !== 'undefined',
        'window.GoNative': typeof window.GoNative !== 'undefined',
        'median (global)': typeof median !== 'undefined',
        'gonative (global)': typeof gonative !== 'undefined',
      };
      
      let medianDetected = false;
      for (const [name, exists] of Object.entries(checks)) {
        if (exists) {
          showStatus(envEl, `✅ ${name}: متوفر`, 'success');
          medianDetected = true;
          log(`Found: ${name}`);
        } else {
          showStatus(envEl, `❌ ${name}: غير متوفر`, 'error');
        }
      }
      
      // Check OneSignal specifically
      try {
        if (typeof median !== 'undefined' && median.onesignal) {
          showStatus(envEl, `✅ median.onesignal: متوفر`, 'success');
          log('median.onesignal is available!');
        } else {
          showStatus(envEl, `❌ median.onesignal: غير متوفر`, 'error');
          log('median.onesignal NOT available');
        }
      } catch (e) {
        showStatus(envEl, `❌ خطأ في التحقق من OneSignal: ${e.message}`, 'error');
        log('Error checking onesignal: ' + e.message);
      }
      
      if (!medianDetected) {
        showStatus(envEl, `⚠️ لم يتم اكتشاف Median - تأكد من تفعيل JavaScript Bridge وإعادة بناء التطبيق`, 'error');
        log('No Median bridge detected!');
      }
    }

    // Test OneSignal
    async function testOneSignal() {
      const resultEl = document.getElementById('onesignal-result');
      resultEl.innerHTML = '';
      log('Starting OneSignal test...');
      
      try {
        // Check if median is available
        if (typeof median === 'undefined') {
          showStatus(resultEl, '❌ median غير متوفر - JavaScript Bridge غير مفعل', 'error');
          log('ERROR: median is undefined');
          return;
        }
        
        if (!median.onesignal) {
          showStatus(resultEl, '❌ median.onesignal غير متوفر', 'error');
          log('ERROR: median.onesignal is undefined');
          return;
        }
        
        log('Calling median.onesignal.push.register()...');
        showStatus(resultEl, '⏳ جاري تسجيل الإشعارات...', 'info');
        
        // Register for push
        median.onesignal.push.register();
        log('register() called');
        
        // Wait a moment
        await new Promise(r => setTimeout(r, 2000));
        
        // Try to get info
        log('Calling median.onesignal.info()...');
        try {
          const info = await median.onesignal.info();
          log('OneSignal info: ' + JSON.stringify(info));
          
          if (info && info.oneSignalUserId) {
            showStatus(resultEl, `✅ تم التسجيل بنجاح!\nUser ID: ${info.oneSignalUserId}`, 'success');
          } else {
            showStatus(resultEl, `⚠️ تم التسجيل ولكن لم يتم الحصول على User ID\nInfo: ${JSON.stringify(info)}`, 'info');
          }
        } catch (infoErr) {
          log('Error getting info: ' + infoErr.message);
          showStatus(resultEl, `⚠️ تم التسجيل ولكن خطأ في الحصول على المعلومات: ${infoErr.message}`, 'info');
        }
        
      } catch (err) {
        log('ERROR: ' + err.message);
        showStatus(resultEl, `❌ خطأ: ${err.message}`, 'error');
      }
    }

    // Run checks on load
    document.addEventListener('DOMContentLoaded', () => {
      log('Page loaded, checking environment...');
      
      // Wait a moment for Median to inject its bridge
      setTimeout(checkEnvironment, 500);
    });
    
    // Also try after a longer delay
    setTimeout(() => {
      log('Re-checking after 2 seconds...');
      if (typeof median !== 'undefined') {
        log('median is now available!');
      }
    }, 2000);
  </script>
</body>
</html>
